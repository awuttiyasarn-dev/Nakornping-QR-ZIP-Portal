<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">📦</div>
      <div>
        <h1>Nakornping QR ZIP Download Portal</h1>
        <div class="subtitle">
          ระบบดาวน์โหลดเอกสารและไฟล์ ZIP โรงพยาบาลนครพิงค์
        </div>
      </div>
    </div>
  </div>
</header>

<main>

  <section class="panel">
    <h2 class="section-title">ค้นหาไฟล์ดาวน์โหลด</h2>
    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="ค้นหาชื่อไฟล์..."
      autocomplete="off"
    >
  </section>

  <section class="panel">
    <h2 class="section-title">รายการไฟล์ ZIP</h2>

    <div id="status" class="status">
      กำลังโหลดรายการไฟล์...
    </div>

    <div id="fileList" class="file-list"></div>
  </section>

  <div id="message" class="notice hidden"></div>

</main>

<footer>
  Nakornping QR ZIP Download Portal
  <br>
  Powered by GitHub Releases & Google Sheets
</footer>

<script>
"use strict";

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CONFIG = {
  APP_NAME: "Nakornping QR ZIP Download Portal",

  // URL ที่ได้จาก Deploy > Web app
  // ต้องลงท้ายด้วย /exec
  GAS_WEB_APP_URL:
    "https://script.google.com/macros/s/PUT_YOUR_DEPLOYMENT_ID/exec",

  // Manifest บน GitHub Pages
  MANIFEST_URL: "./files.json",

  // ป้องกัน redirect ไป URL ภายนอกที่ไม่ใช่ GitHub Releases
  ALLOWED_DOWNLOAD_HOST: "github.com"
};

let files = [];


/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {
  document
    .getElementById("searchInput")
    .addEventListener("input", filterFiles);

  loadFiles();
});


/* =========================================================
   LOAD MANIFEST
   ========================================================= */

async function loadFiles() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      CONFIG.MANIFEST_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("ไม่สามารถโหลด files.json ได้");
    }

    const manifest = await response.json();

    if (!Array.isArray(manifest.files)) {
      throw new Error("รูปแบบ files.json ไม่ถูกต้อง");
    }

    files = manifest.files;

    renderFiles(files);

    if (files.length === 0) {
      status.textContent = "ยังไม่มีไฟล์ดาวน์โหลด";
    } else {
      status.textContent = "พบไฟล์ทั้งหมด " + files.length + " รายการ";
    }

  } catch (error) {
    status.textContent = "ไม่สามารถโหลดรายการไฟล์ได้";

    showMessage(
      error.message +
      " กรุณาตรวจสอบไฟล์ files.json บน GitHub Pages",
      true
    );
  }
}


/* =========================================================
   RENDER FILES
   รองรับชื่อ Field หลายรูปแบบ
   ========================================================= */

function getFileId(file) {
  return String(file.id || file.file_id || "");
}

function getFileName(file) {
  return String(
    file.name ||
    file.file_name ||
    file.filename ||
    "Unnamed ZIP"
  );
}

function getDownloadUrl(file) {
  return String(
    file.download_url ||
    file.browser_download_url ||
    ""
  );
}

function getFileSize(file) {
  const size = Number(file.size || file.size_bytes || 0);

  if (!size) return "ไม่ระบุขนาด";

  if (size < 1024 ** 2) {
    return (size / 1024).toFixed(1) + " KB";
  }

  return (size / (1024 ** 2)).toFixed(2) + " MB";
}

function renderFiles(items) {
  const container = document.getElementById("fileList");
  const status = document.getElementById("status");

  container.innerHTML = "";

  if (!items.length) {
    status.textContent = "ไม่พบรายการไฟล์";
    return;
  }

  status.textContent = "แสดง " + items.length + " รายการ";

  items.forEach(file => {
    const name = getFileName(file);
    const size = getFileSize(file);

    const card = document.createElement("div");
    card.className = "file";

    const icon = document.createElement("div");
    icon.className = "file-icon";
    icon.textContent = "🗜️";

    const info = document.createElement("div");
    info.className = "file-info";

    const title = document.createElement("div");
    title.className = "file-name";
    title.textContent = name;

    const meta = document.createElement("div");
    meta.className = "file-meta";
    meta.textContent = "ZIP File • " + size;

    info.appendChild(title);
    info.appendChild(meta);

    const button = document.createElement("button");
    button.textContent = "⬇ ดาวน์โหลด";

    button.addEventListener("click", () => {
      downloadFile(file, button);
    });

    card.appendChild(icon);
    card.appendChild(info);
    card.appendChild(button);

    container.appendChild(card);
  });
}


/* =========================================================
   SEARCH
   ========================================================= */

function filterFiles() {
  const keyword = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const filtered = files.filter(file =>
    getFileName(file).toLowerCase().includes(keyword)
  );

  renderFiles(filtered);
}


/* =========================================================
   VALIDATE DOWNLOAD URL
   ========================================================= */

function validateDownloadUrl(value) {
  try {
    const url = new URL(value);

    if (url.protocol !== "https:") return false;

    if (url.hostname !== CONFIG.ALLOWED_DOWNLOAD_HOST) {
      return false;
    }

    if (!url.pathname.includes("/releases/download/")) {
      return false;
    }

    return true;

  } catch (error) {
    return false;
  }
}


/* =========================================================
   DOWNLOAD + GOOGLE SHEETS LOGGING
   ========================================================= */

async function downloadFile(file, button) {
  const fileId = getFileId(file);
  const fileName = getFileName(file);
  const downloadUrl = getDownloadUrl(file);

  if (!fileId) {
    showMessage("ไม่พบ File ID ของรายการนี้", true);
    return;
  }

  if (!validateDownloadUrl(downloadUrl)) {
    showMessage("URL ดาวน์โหลดไม่ถูกต้องหรือไม่ใช่ GitHub Release", true);
    return;
  }

  if (
    !CONFIG.GAS_WEB_APP_URL.endsWith("/exec") ||
    CONFIG.GAS_WEB_APP_URL.includes("PUT_YOUR_DEPLOYMENT_ID")
  ) {
    showMessage("กรุณาตั้งค่า GAS_WEB_APP_URL ก่อนใช้งาน", true);
    return;
  }

  button.disabled = true;
  button.textContent = "กำลังเตรียมดาวน์โหลด...";

  const payload = {
    file_id: fileId,
    file_name: fileName,
    download_url: downloadUrl,
    user_agent: navigator.userAgent,
    referrer: document.referrer
  };

  try {
    /*
     * ใช้ no-cors และ text/plain เพื่อลดปัญหา
     * CORS preflight ระหว่าง GitHub Pages กับ Apps Script
     *
     * Response จะเป็น opaque จึงอ่าน JSON กลับไม่ได้
     * แต่ Promise จะ resolve เมื่อ browser จัดการ request แล้ว
     */

    await fetch(CONFIG.GAS_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    button.textContent = "กำลังเปิดดาวน์โหลด...";

    showMessage("กำลังนำคุณไปยัง GitHub Releases");

    // ให้เวลา Browser ส่งคำขอบันทึกข้อมูล
    setTimeout(() => {
      window.location.assign(downloadUrl);
    }, 700);

  } catch (error) {
    button.disabled = false;
    button.textContent = "⬇ ดาวน์โหลด";

    showMessage(
      "ไม่สามารถส่งข้อมูลบันทึกการดาวน์โหลดได้ กรุณาลองอีกครั้ง",
      true
    );
  }
}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(message, isError = false) {
  const box = document.getElementById("message");

  box.textContent = message;
  box.classList.remove("hidden", "error");

  if (isError) {
    box.classList.add("error");
  }
}
</script>

</body>
</html>
